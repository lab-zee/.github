name: Feature request
description: Propose a focused improvement to a Lab Z project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user need or limitation, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable result would make this request successful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include alternatives, compatibility concerns, and tradeoffs when known.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized examples, links, or prior art. Do not include secrets or private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and kept this request focused on one outcome.
          required: true
